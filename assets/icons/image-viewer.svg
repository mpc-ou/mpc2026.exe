<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd9e8"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a95ff"/>
      <stop offset="100%" stop-color="#a8d8ff"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
  </defs>
  <!-- Outer Photo Frame -->
  <rect x="4" y="6" width="38" height="32" rx="3" fill="url(#frameGrad)" stroke="#003c74" stroke-width="2"/>
  <!-- Sky -->
  <rect x="8" y="10" width="30" height="24" fill="url(#skyGrad)" stroke="#5b87b8" stroke-width="1"/>
  <!-- Sun -->
  <circle cx="15" cy="16" r="3.8" fill="#ffeb3b" stroke="#f57f17" stroke-width="0.8"/>
  <!-- Mountains / Hills -->
  <path d="M 8,34 L 8,27 L 17,20 L 26,28 L 32,22 L 38,27 L 38,34 Z" fill="url(#hillGrad)"/>
  <!-- Magnifying Glass Overlay (Windows XP Picture Viewer emblem) -->
  <circle cx="34" cy="32" r="7.5" fill="rgba(255,255,255,0.75)" stroke="#003399" stroke-width="2.2"/>
  <line x1="39.2" y1="37.2" x2="45" y2="43" stroke="#d97706" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="39.2" y1="37.2" x2="45" y2="43" stroke="#fbbf24" stroke-width="1.6" stroke-linecap="round"/>
</svg>
