<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Windows XP style Command Prompt: blue title bar, black console, large "C:\_" so it stays readable at icon size -->
  <defs>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b9bff"/>
      <stop offset="0.5" stop-color="#1e5fd8"/>
      <stop offset="1" stop-color="#0f3fa8"/>
    </linearGradient>
  </defs>
  <rect x="3" y="6" width="42" height="36" rx="3" fill="#0a246a"/>
  <rect x="4" y="7" width="40" height="9" rx="2" fill="url(#title)"/>
  <rect x="37" y="9" width="5" height="5" rx="1" fill="#e2574c" stroke="#fff" stroke-width="0.6"/>
  <rect x="4" y="16" width="40" height="25" fill="#000"/>
  <text x="7" y="33" font-family="Consolas, 'Lucida Console', 'Courier New', monospace" font-size="12" font-weight="bold" fill="#e6e6e6">C:\</text>
  <rect x="31" y="31" width="6" height="2.4" fill="#e6e6e6"/>
</svg>
