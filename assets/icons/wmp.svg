<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="wmp-outer" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#bcc7d4"/>
      <stop offset="70%" stop-color="#5a6878"/>
      <stop offset="100%" stop-color="#283442"/>
    </radialGradient>
    <radialGradient id="wmp-inner" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="wmp-play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff3300"/>
    </linearGradient>
  </defs>
  <!-- Outer Metallic Ring -->
  <circle cx="24" cy="24" r="20" fill="url(#wmp-outer)" stroke="#1a2530" stroke-width="1.5"/>
  <!-- Bevel Ring -->
  <circle cx="24" cy="24" r="15.5" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>
  <!-- Inner Dark Core -->
  <circle cx="24" cy="24" r="14" fill="url(#wmp-inner)"/>
  <!-- Blue Arc Glow -->
  <path d="M12 24 A 12 12 0 0 1 36 24" fill="none" stroke="#00d2ff" stroke-width="2.5" opacity="0.8"/>
  <!-- Play Triangle -->
  <polygon points="21,17 31,24 21,31" fill="url(#wmp-play)" stroke="#992200" stroke-width="0.8"/>
  <polygon points="21,17 26,24 21,31" fill="#ffbb33" opacity="0.5"/>
</svg>
