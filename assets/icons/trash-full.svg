<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bin-metal-f" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bccad6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8a9ba8"/>
    </linearGradient>
    <linearGradient id="bin-glass-f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#80d8ff"/>
      <stop offset="100%" stop-color="#0091ea"/>
    </linearGradient>
    <linearGradient id="paper-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>

  <!-- Crumpled paper & trash inside sticking out of the rim -->
  <g id="trash-paper-contents">
    <!-- Back paper sheets -->
    <polygon points="17,14 15,6 23,8 24,14" fill="#cfd8dc" stroke="#90a4ae" stroke-width="0.8"/>
    <polygon points="22,14 24,4 32,5 31,14" fill="#eceff1" stroke="#b0bec5" stroke-width="0.8"/>
    <!-- Folded document with line scribbles -->
    <polygon points="25,13 29,3 35,7 32,14" fill="url(#paper-grad)" stroke="#90a4ae" stroke-width="0.8"/>
    <line x1="28" y1="6" x2="33" y2="8" stroke="#1976d2" stroke-width="0.8" stroke-dasharray="1,1"/>
    <line x1="27" y1="8" x2="32" y2="10" stroke="#546e7a" stroke-width="0.8" stroke-dasharray="1,1"/>
    
    <!-- Crumpled yellow/red sticky notes -->
    <polygon points="15,13 18,9 22,11 20,15" fill="#fff59d" stroke="#fbc02d" stroke-width="0.7"/>
    <polygon points="28,14 33,10 37,13 34,16" fill="#ffcdd2" stroke="#e57373" stroke-width="0.7"/>
    <!-- Big crumpled main paper wad in center -->
    <path d="M 18,14 Q 16,8 21,7 Q 25,5 28,8 Q 32,7 32,14 Z" fill="#ffffff" stroke="#b0bec5" stroke-width="0.9"/>
    <path d="M 20,10 Q 23,12 26,9 Q 28,11 30,10" fill="none" stroke="#cfd8dc" stroke-width="0.8"/>
  </g>

  <!-- Bin Body (Translucent Blue Glass/Plastic) -->
  <path d="M12 14 L15 41 C15.2 42.5 16.5 43.5 18 43.5 L30 43.5 C31.5 43.5 32.8 42.5 33 41 L36 14 Z" fill="url(#bin-glass-f)" fill-opacity="0.38" stroke="#546e7a" stroke-width="1.5"/>

  <!-- Visible paper inside through the translucent glass -->
  <path d="M 17,18 Q 23,22 30,17 L 31,32 Q 24,35 17,30 Z" fill="#ffffff" fill-opacity="0.65"/>
  <line x1="19" y1="22" x2="28" y2="21" stroke="#90a4ae" stroke-width="0.8" opacity="0.6"/>
  <line x1="19" y1="25" x2="27" y2="25" stroke="#1976d2" stroke-width="0.8" opacity="0.6"/>

  <!-- Rim Top -->
  <ellipse cx="24" cy="14" rx="13" ry="3.5" fill="none" stroke="#546e7a" stroke-width="1.2"/>
  <path d="M 11,14 C 11,16 37,16 37,14" fill="none" stroke="url(#bin-metal-f)" stroke-width="2"/>

  <!-- Wire/Mesh Lines -->
  <line x1="16" y1="18" x2="18" y2="39" stroke="#78909c" stroke-width="1.2"/>
  <line x1="21" y1="18" x2="22" y2="40" stroke="#ffffff" stroke-width="1.2" opacity="0.8"/>
  <line x1="27" y1="18" x2="26" y2="40" stroke="#78909c" stroke-width="1.2"/>
  <line x1="32" y1="18" x2="30" y2="39" stroke="#78909c" stroke-width="1.2"/>

  <!-- Recycle Symbol in Green -->
  <path d="M22 26 L24 23 L26 26 H24.5 C24.5 29 27 30 28 29 L29 31 C27 32.5 23 32 23 26 Z" fill="#00c853"/>
</svg>
