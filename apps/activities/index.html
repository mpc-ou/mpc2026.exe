<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACTIVITIES</title>
  <link rel="stylesheet" href="../../assets/fonts/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Tahoma, 'Segoe UI', sans-serif;
      font-size: 11px;
      color: #111;
      background-color: #ffffff;
      padding: 16px;
      overflow-y: auto;
      height: 100vh;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 2px solid #0055ea;
      padding-bottom: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: bold;
      color: #003399;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-tags {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .tag-btn {
      background: #ece9d8;
      border: 1px solid #7f9db9;
      padding: 3px 10px;
      border-radius: 3px;
      font-size: 11px;
      cursor: pointer;
      font-family: Tahoma, sans-serif;
    }
    .tag-btn:hover, .tag-btn.active {
      background: #0055ea;
      color: #fff;
      border-color: #003399;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }
    .photo-card {
      border: 1px solid #dcdcdc;
      border-radius: 4px;
      overflow: hidden;
      background: #fafafa;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: all 0.2s;
    }
    .photo-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
      border-color: #0055ea;
    }
    .photo-thumb {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
      background: #eee;
    }
    .photo-info {
      padding: 8px;
    }
    .photo-name {
      font-weight: bold;
      color: #003399;
      margin-bottom: 2px;
    }
    .photo-meta {
      font-size: 10px;
      color: #666;
    }
    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox-img {
      max-width: 90%;
      max-height: 80vh;
      object-fit: contain;
      border: 3px solid #fff;
      border-radius: 4px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    .lightbox-caption {
      color: #fff;
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
    }
    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 20px;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
  <link rel="stylesheet" href="../_shared/responsive.css">
</head>
<body>
  <div class="header-bar">
    <div class="title"><i class="bi bi-images"></i> Thư Viện Hoạt Động & Workshop MPClub</div>
    <span style="color: #666;">2023 – 2026</span>
  </div>

  <div class="filter-tags">
    <button class="tag-btn active" data-category="all">Tất cả</button>
    <button class="tag-btn" data-category="training">Workshop & Training</button>
    <button class="tag-btn" data-category="contest">Cuộc thi & Hackathon</button>
    <button class="tag-btn" data-category="members">Gắn kết & Thành viên</button>
    <button class="tag-btn" data-category="web">Dự án Web Design</button>
  </div>

  <div class="gallery-grid" id="gallery">
    <!-- Photos dynamically rendered -->
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <div class="lightbox-close" id="lightbox-close">&times;</div>
    <img src="" class="lightbox-img" id="lightbox-img" alt="" />
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <script>
    const photos = [
      { src: '../../assets/images/the-open-clubs/contest-0.jpg', name: 'Cuộc thi Học Thuật 2024', cat: 'contest', date: 'Khoa CNTT OU' },
      { src: '../../assets/images/the-open-clubs/training-1.jpg', name: 'Workshop Git & Lập Trình', cat: 'training', date: 'Training định kỳ' },
      { src: '../../assets/images/the-open-clubs/members-4.jpg', name: 'Gắn kết Tân Thành Viên', cat: 'members', date: 'Bonding Camp' },
      { src: '../../assets/images/the-open-clubs/webdesign-1.jpg', name: 'Triển Khai Dự Án Web', cat: 'web', date: 'Thực chiến sản phẩm' },
      { src: '../../assets/images/the-open-clubs/activities-0.jpg', name: 'Buổi Sinh Hoạt Chuyên Môn', cat: 'training', date: 'Học thuật MPC' },
      { src: '../../assets/images/the-open-clubs/contest-1.jpg', name: 'Trao Giải Hackathon', cat: 'contest', date: 'Giải đấu nội bộ' },
      { src: '../../assets/images/the-open-clubs/members-8.jpg', name: 'Đại Gia Đình MPClub', cat: 'members', date: 'Kỷ niệm thành lập' },
      { src: '../../assets/images/the-open-clubs/cdtsv-0.jpg', name: 'Chiến Dịch Tình Nguyện Mùa Hè', cat: 'members', date: 'Hoạt động Đoàn Hội' },
      { src: '../../assets/images/the-open-clubs/2026-0.jpg', name: 'Khởi Động Tuyển Sinh 2026', cat: 'training', date: 'Tuyển Thành Viên Genesis' }
    ];

    const gallery = document.getElementById('gallery');
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const lightboxClose = document.getElementById('lightbox-close');

    function renderGallery(cat) {
      gallery.innerHTML = '';
      photos.filter(p => cat === 'all' || p.cat === cat).forEach(p => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
          <img src="${p.src}" class="photo-thumb" alt="${p.name}" loading="lazy" />
          <div class="photo-info">
            <div class="photo-name">${p.name}</div>
            <div class="photo-meta">${p.date}</div>
          </div>
        `;
        card.addEventListener('click', () => {
          lightboxImg.src = p.src;
          lightboxCaption.textContent = `${p.name} • ${p.date}`;
          lightbox.classList.add('active');
        });
        gallery.appendChild(card);
      });
    }

    renderGallery('all');

    document.querySelectorAll('.tag-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery(btn.dataset.category);
      });
    });

    lightboxClose.addEventListener('click', () => lightbox.classList.remove('active'));
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) lightbox.classList.remove('active');
    });
  </script>
</body>
</html>
