<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUR_TEAMS - Các Ban Chuyên Môn MPClub</title>
  <link rel="stylesheet" href="../../assets/fonts/bootstrap-icons/bootstrap-icons.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f0f4f9;
      color: #333;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif;
      font-size: 13px;
      line-height: 1.6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header-bar {
      background: linear-gradient(180deg, #ffffff 0%, #ece9d8 100%);
      border-bottom: 1px solid #d0ccb8;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 15px;
      font-weight: bold;
      color: #003399;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .teams-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    /* Left Sidebar: Team List */
    .teams-sidebar {
      width: 220px;
      background: #ffffff;
      border-right: 1px solid #d0ccb8;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }
    .team-nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
      background: #f7f9fc;
      transition: all 0.2s;
    }
    .team-nav-btn:hover {
      background: #edf3fc;
      border-color: #7f9db9;
    }
    .team-nav-btn.active {
      background: #316ac5;
      color: #ffffff;
      font-weight: bold;
      border-color: #1a4f9c;
    }
    .team-nav-icon {
      font-size: 18px;
    }
    /* Right Pane: Detail Card */
    .teams-detail-pane {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f0f4f9;
    }
    .detail-card {
      background: #ffffff;
      border: 1px solid #c0d0e6;
      border-radius: 6px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 2px solid #eef2f7;
    }
    .detail-icon {
      font-size: 32px;
    }
    .detail-title {
      font-size: 20px;
      font-weight: bold;
      color: #003399;
    }
    .detail-desc {
      color: #444;
      line-height: 1.7;
      margin-bottom: 20px;
      font-size: 13.5px;
    }
    .skills-header {
      font-weight: bold;
      color: #222;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .skills-list {
      list-style: none;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 24px;
    }
    .skill-item {
      background: #f4f7fc;
      border-left: 3px solid #0055ea;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 2px;
    }
    .btn-apply-team {
      background: #ff6600;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
    }
    .btn-apply-team:hover {
      background: #e65c00;
    }
    @media (max-width: 600px) {
      .teams-container { flex-direction: column; }
      .teams-sidebar { width: 100%; height: 120px; }
      .skills-list { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="../_shared/responsive.css">
</head>
<body>

  <div class="header-bar">
    <div class="header-title">
      <i class="bi bi-people-fill" style="color: #0055ea;"></i>
      <span>Các Ban Chuyên Môn – MPClub (OU IT)</span>
    </div>
    <span style="font-size: 11px; color: #666;">Dữ liệu: teams.json</span>
  </div>

  <div class="teams-container">
    <div class="teams-sidebar" id="teams-nav"></div>
    <div class="teams-detail-pane" id="teams-content"></div>
  </div>

  <script>
    const fallbackTeams = [
      {
        id: "BLT",
        name_vi: "Ban Lập Trình (BLT)",
        icon: "💻",
        desc_vi: "Nòng cốt kỹ thuật của MPClub. Nơi các thành viên cùng nghiên cứu công nghệ mới, thực chiến xây dựng các dự án phần mềm thật (Web, Mobile, Bot, DevOps) và huấn luyện đội tuyển thuật toán thi đấu.",
        skills_vi: ["Frontend & Backend Development", "Git/GitHub Team Workflow", "Tư duy giải thuật & Cấu trúc dữ liệu", "DevOps & Cloud Deployment"]
      },
      {
        id: "BTK",
        name_vi: "Ban Thiết Kế (BTK)",
        icon: "🎨",
        desc_vi: "Linh hồn thị giác của CLB. Phụ trách xây dựng bộ nhận diện thương hiệu, thiết kế UI/UX cho các sản phẩm phần mềm, vẽ linh vật mascot và sáng tạo các ấn phẩm truyền thông độc đáo.",
        skills_vi: ["Figma & UI/UX Product Design", "Photoshop / Illustrator", "Tư duy màu sắc & Typography", "Thiết kế linh vật & Pixel Art"]
      },
      {
        id: "BTT",
        name_vi: "Ban Truyền Thông (BTT)",
        icon: "📢",
        desc_vi: "Cầu nối lan tỏa hình ảnh và giá trị của MPClub đến toàn thể sinh viên Khoa CNTT - ĐH Mở TP.HCM. Lên kế hoạch chiến dịch truyền thông đa kênh, sáng tạo video ngắn và biên tập bài viết.",
        skills_vi: ["Content Strategy & Copywriting", "Quản trị Fanpage & Kênh truyền thông", "Quay dựng video ngắn (TikTok/Reels)", "Kỹ năng phỏng vấn & bắt trend"]
      },
      {
        id: "BSK",
        name_vi: "Ban Sự Kiện (BSK)",
        icon: "🎪",
        desc_vi: "Những nhà tổ chức tài ba đứng sau các giải đấu học thuật lớn, workshop công nghệ chuyên sâu và các chuyến dã ngoại bonding đáng nhớ của đại gia đình MPClub.",
        skills_vi: ["Lập kế hoạch & Dự trù ngân sách sự kiện", "Điều phối MC, diễn giả và hậu cần", "Kỹ năng đàm phán & Làm việc nhóm", "Quản trị rủi ro & Xử lý tình huống"]
      }
    ];

    let teamsData = [];
    let activeId = "BLT";

    function renderNav() {
      const navEl = document.getElementById('teams-nav');
      navEl.innerHTML = teamsData.map(t => `
        <div class="team-nav-btn ${t.id === activeId ? 'active' : ''}" data-id="${t.id}">
          <span class="team-nav-icon">${t.icon}</span>
          <span>${t.name_vi}</span>
        </div>
      `).join('');

      navEl.querySelectorAll('.team-nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeId = btn.getAttribute('data-id');
          renderNav();
          renderDetail();
        });
      });
    }

    function renderDetail() {
      const detailEl = document.getElementById('teams-content');
      const team = teamsData.find(t => t.id === activeId) || teamsData[0];
      if (!team) return;

      detailEl.innerHTML = `
        <div class="detail-card">
          <div class="detail-header">
            <span class="detail-icon">${team.icon}</span>
            <div class="detail-title">${team.name_vi}</div>
          </div>
          <div class="detail-desc">${team.desc_vi}</div>

          <div class="skills-header"><i class="bi bi-check2-circle" style="color: #008800;"></i> Kỹ năng đạt được sau khi tham gia:</div>
          <ul class="skills-list">
            ${(team.skills_vi || []).map(s => `<li class="skill-item">✔ ${s}</li>`).join('')}
          </ul>

          <button class="btn-apply-team" id="btn-apply-now">
            <i class="bi bi-rocket-takeoff-fill"></i> Ứng tuyển vào ${team.name_vi} ngay
          </button>
        </div>
      `;

      document.getElementById('btn-apply-now')?.addEventListener('click', () => {
        if (window.parent && window.parent.WindowManager) {
          window.parent.WindowManager.open('JOIN_MPC.exe');
        }
      });
    }

    fetch('./teams.json')
      .then(r => r.json())
      .then(data => {
        teamsData = data;
        renderNav();
        renderDetail();
      })
      .catch(() => {
        teamsData = fallbackTeams;
        renderNav();
        renderDetail();
      });
  </script>
</body>
</html>
