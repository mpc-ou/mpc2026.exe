<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOIN_MPC.exe - Setup Wizard 2026</title>
  <link rel="stylesheet" href="../../assets/fonts/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #ece9d8;
      color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, sans-serif;
      font-size: 12px;
      user-select: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .wizard-header {
      background: #ffffff;
      border-bottom: 1px solid #d0ccb8;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .wizard-title {
      font-size: 14px;
      font-weight: bold;
      color: #003399;
    }
    .wizard-desc {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }
    .wizard-body {
      flex: 1;
      padding: 16px 20px;
      background: #ece9d8;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .welcome-box {
      background: #ffffff;
      border: 1px solid #7f9db9;
      border-radius: 3px;
      padding: 12px 14px;
      line-height: 1.5;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    label {
      font-weight: bold;
      color: #333;
    }
    input[type="text"], input[type="email"], select {
      height: 24px;
      padding: 2px 6px;
      border: 1px solid #7f9db9;
      background: #fff;
      font-size: 12px;
      outline: none;
    }
    .depts-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .dept-option {
      background: #fff;
      border: 1px solid #7f9db9;
      border-radius: 3px;
      padding: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .dept-option:hover {
      background: #f0f7ff;
      border-color: #0055ea;
    }
    .dept-option input {
      cursor: pointer;
    }
    .wizard-footer {
      height: 48px;
      background: #ece9d8;
      border-top: 1px solid #d0ccb8;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 16px;
      gap: 8px;
    }
    .xp-btn {
      min-width: 80px;
      height: 24px;
      background: #ece9d8;
      border: 1px solid #003c74;
      border-radius: 3px;
      box-shadow: inset 1px 1px 0px #fff, inset -1px -1px 0px #707070;
      font-size: 11px;
      cursor: pointer;
      padding: 0 12px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .xp-btn:active {
      box-shadow: inset -1px -1px 0px #fff, inset 1px 1px 0px #707070;
      padding-top: 1px;
    }
    .xp-btn.primary {
      border: 2px solid #0055ea;
      font-weight: bold;
      background: linear-gradient(180deg, #ffffff 0%, #ece9d8 100%);
    }
  </style>
</head>
<body>

  <div class="wizard-header">
    <div>
      <div class="wizard-title">Ứng Tuyển Thành Viên MPClub 2026 : Genesis</div>
      <div class="wizard-desc">Trình hướng dẫn đăng ký tham gia CLB Đa Nền Tảng (OU IT)</div>
    </div>
    <img src="../../assets/icons/logo.png" style="width: 36px; height: 36px; object-fit: contain;" alt="" />
  </div>

  <div class="wizard-body">
    <div class="welcome-box">
      <strong>Chào mừng bạn đến với đợt tuyển thành viên MPClub 2026!</strong><br/>
      Hãy chọn ban chuyên môn bạn muốn thử sức để nhận link biểu mẫu ứng tuyển chính thức của CLB.
    </div>

    <div class="form-group">
      <label>Họ và tên của bạn:</label>
      <input type="text" id="inp-name" placeholder="Ví dụ: Nguyễn Văn A" />
    </div>

    <div class="form-group">
      <label>Mã số sinh viên (MSSV) / Khóa:</label>
      <input type="text" id="inp-mssv" placeholder="Ví dụ: 2551010001 (K25/K26)" />
    </div>

    <div class="form-group">
      <label>Chọn Ban Chuyên Môn nguyện vọng chính:</label>
      <div class="depts-grid">
        <label class="dept-option">
          <input type="radio" name="dept" value="BLT" checked />
          <span>💻 Ban Lập Trình (BLT)</span>
        </label>
        <label class="dept-option">
          <input type="radio" name="dept" value="BTK" />
          <span>🎨 Ban Thiết Kế (BTK)</span>
        </label>
        <label class="dept-option">
          <input type="radio" name="dept" value="BTT" />
          <span>📢 Ban Truyền Thông (BTT)</span>
        </label>
        <label class="dept-option">
          <input type="radio" name="dept" value="BSK" />
          <span>🎪 Ban Sự Kiện (BSK)</span>
        </label>
      </div>
    </div>
  </div>

  <div class="wizard-footer">
    <button class="xp-btn" id="btn-cancel">Hủy</button>
    <button class="xp-btn primary" id="btn-submit">
      <span>Đăng Ký Ngay</span> <i class="bi bi-arrow-right-short"></i>
    </button>
  </div>

  <script>
    document.getElementById('btn-cancel').addEventListener('click', () => {
      if (window.parent && window.parent.WindowManager) {
        const win = window.parent.WindowManager.get('JOIN_MPC.exe');
        if (win) win.close();
      }
    });

    document.getElementById('btn-submit').addEventListener('click', () => {
      const name = document.getElementById('inp-name').value.trim();
      const mssv = document.getElementById('inp-mssv').value.trim();
      const selectedDept = document.querySelector('input[name="dept"]:checked')?.value || 'BLT';

      // Open Google Forms or Registration link in new tab
      const formUrl = `https://forms.gle/mpclub2026recruitment?entry.name=${encodeURIComponent(name)}&entry.mssv=${encodeURIComponent(mssv)}&entry.dept=${selectedDept}`;
      
      alert(`Cảm ơn bạn ${name ? name : 'bạn sinh viên OU IT'}!\n\nHệ thống sẽ mở Form đăng ký chính thức của MPClub tuyển thành viên 2026.`);
      window.open(formUrl, '_blank');
    });
  </script>
</body>
</html>
